<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Organizer Portal | Gaming Tournament Portal</title>
  <link rel="stylesheet" href="../../assets/css/main.css" />
</head>
<body>
  <main class="container">
    <header class="page-header panel">
      <div>
        <h1 id="welcome-text"></h1>
        <p id="role-text" class="muted"></p>
      </div>
      <nav class="page-links">
        <a href="../../index.html">Home</a>
        <a href="player.html">Player View</a>
        <a href="spectator.html">Spectator View</a>
        <button id="logout-btn" class="logout-btn" type="button">Logout</button>
      </nav>
    </header>

    <section class="grid portal-grid">
      <article class="panel">
        <h3>Registrations Overview</h3>
        <div id="organizer-registrations"></div>
      </article>

      <article class="panel">
        <h3>Update Match Result</h3>
        <form id="result-form" class="stack">
          <label>
            Tournament
            <select id="result-tournament"></select>
          </label>
          <label>
            Winner
            <input type="text" id="result-winner" required />
          </label>
          <label>
            Points Awarded
            <input type="number" id="result-points" min="1" value="10" required />
          </label>
          <button type="submit">Save Result</button>
        </form>
      </article>

      <article class="panel">
        <h3>Prize Distribution</h3>
        <form id="prize-form" class="stack">
          <label>
            Tournament
            <select id="prize-tournament"></select>
          </label>
          <label>
            Prize Details
            <input type="text" id="prize-details" placeholder="1st: $300, 2nd: $150" required />
          </label>
          <button type="submit">Publish Prize</button>
        </form>
      </article>

      <article class="panel">
        <h3>Post Live Update</h3>
        <form id="announcement-form" class="stack">
          <label>
            Message
            <input type="text" id="announcement-text" required />
          </label>
          <button type="submit">Publish Update</button>
        </form>
      </article>

      <article class="panel">
        <h3>Leaderboard</h3>
        <table>
          <thead>
            <tr><th>Player / Team</th><th>Points</th></tr>
          </thead>
          <tbody id="leaderboard-body"></tbody>
        </table>
      </article>

      <article class="panel">
        <h3>Live Updates Feed</h3>
        <ul id="announcement-list"></ul>
      </article>
    </section>
  </main>

  <script type="module" src="../../assets/js/portal/organizer.js"></script>
</body>
</html>
