<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spectator Portal | Gaming Tournament Portal</title>
  <link rel="stylesheet" href="../../assets/css/main.css" />
</head>
<body>
  <main class="container">
    <header class="page-header panel">
      <div>
        <h1 id="welcome-text"></h1>
        <p id="role-text" class="muted"></p>
      </div>
      <nav class="page-links">
        <a href="../../index.html">Home</a>
        <a href="player.html">Player View</a>
        <a href="organizer.html">Organizer View</a>
        <button id="logout-btn" class="logout-btn" type="button">Logout</button>
      </nav>
    </header>

    <section class="grid portal-grid">
      <article class="panel">
        <h3>Leaderboard</h3>
        <table>
          <thead>
            <tr><th>Player / Team</th><th>Points</th></tr>
          </thead>
          <tbody id="leaderboard-body"></tbody>
        </table>
      </article>

      <article class="panel">
        <h3>Live Updates</h3>
        <ul id="announcement-list"></ul>
      </article>

      <article class="panel">
        <h3>React Live</h3>
        <div id="reaction-box" class="reaction-box"></div>
      </article>
    </section>
  </main>

  <script type="module" src="../../assets/js/portal/spectator.js"></script>
</body>
</html>
